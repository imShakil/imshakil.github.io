<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a07"/>
      <stop offset="50%" stop-color="#07140e"/>
      <stop offset="100%" stop-color="#030805"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background with Grid -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial Glow Behind Center -->
  <circle cx="400" cy="225" r="180" fill="#06b6d4" opacity="0.08" filter="blur(60px)"/>

  <!-- Terminal Window Frame -->
  <rect x="40" y="30" width="720" height="390" rx="10" fill="#040906" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3"/>
  <path d="M 40 68 L 760 68" stroke="#10b981" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Terminal Dots -->
  <circle cx="64" cy="49" r="5" fill="#f87171" opacity="0.8"/>
  <circle cx="82" cy="49" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="100" cy="49" r="5" fill="#34d399" opacity="0.8"/>
  <text x="125" y="53" fill="#6ee7b7" opacity="0.6" font-family="monospace" font-size="12" letter-spacing="1">cloudsinclick ~ terraform-vm-orchestrator</text>

  <!-- Architecture Flow Nodes -->
  <!-- Node 1: Developer PR Trigger -->
  <rect x="70" y="110" width="170" height="100" rx="8" fill="#091811" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <text x="85" y="138" fill="#a7f3d0" font-family="monospace" font-size="13" font-weight="bold">Workflow Trigger</text>
  <text x="85" y="160" fill="#6ee7b7" opacity="0.6" font-family="monospace" font-size="11">GitHub Actions / CI</text>
  <text x="85" y="185" fill="#38bdf8" font-family="monospace" font-size="10" opacity="0.9">Automated Inputs Validated</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 240 160 L 290 160" stroke="#10b981" stroke-width="2" stroke-dasharray="4" opacity="0.8"/>
  <polygon points="295,160 287,155 287,165" fill="#10b981"/>

  <!-- Node 2: Terraform Engine (Centerpiece) -->
  <rect x="300" y="90" width="200" height="140" rx="8" fill="#0c2319" stroke="url(#cyanGlow)" stroke-width="1.8"/>
  <rect x="310" y="102" width="68" height="18" rx="4" fill="#06b6d4" opacity="0.15"/>
  <text x="317" y="115" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">TERRAFORM</text>
  <text x="312" y="145" fill="#ecfdf5" font-family="monospace" font-size="16" font-weight="bold">IaC Orchestrator</text>
  <text x="312" y="170" fill="#6ee7b7" font-family="monospace" font-size="11">Modular Multi-Cloud VM</text>
  <text x="312" y="195" fill="#34d399" font-family="monospace" font-size="10">Auto-Register CI Agents</text>
  <text x="312" y="213" fill="#06b6d4" font-family="monospace" font-size="9" opacity="0.8">Scheduled Auto-Teardown</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 500 160 L 550 160" stroke="#10b981" stroke-width="2" stroke-dasharray="4" opacity="0.8"/>
  <polygon points="555,160 547,155 547,165" fill="#10b981"/>

  <!-- Node 3: Cloud Compute Nodes -->
  <rect x="560" y="110" width="170" height="100" rx="8" fill="#091811" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <text x="575" y="138" fill="#a7f3d0" font-family="monospace" font-size="13" font-weight="bold">Multi-Cloud Node</text>
  <text x="575" y="160" fill="#6ee7b7" opacity="0.6" font-family="monospace" font-size="11">Isolated Dev/CI Host</text>
  <text x="575" y="185" fill="#34d399" font-family="monospace" font-size="10" opacity="0.9">✓ Ready in &lt; 3 mins</text>

  <!-- Terminal Live Log Output at Bottom -->
  <rect x="70" y="260" width="660" height="130" rx="6" fill="#020503" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.2"/>
  <text x="90" y="288" fill="#34d399" font-family="monospace" font-size="12">$ terraform apply -auto-approve --parallelism=15</text>
  <text x="90" y="312" fill="#6ee7b7" opacity="0.75" font-family="monospace" font-size="11">[PROVISION] Virtual Machine deployed in 2m 48s (cut from 2hr manual workflow)</text>
  <text x="90" y="334" fill="#6ee7b7" opacity="0.75" font-family="monospace" font-size="11">[NETWORK] DNS record bound • Azure DevOps runner agent joined cluster</text>
  <text x="90" y="356" fill="#38bdf8" font-family="monospace" font-size="11">[COST CONTROL] Scheduled destroy timer registered • Idle compute costs -35%</text>
  <circle cx="620" cy="370" r="4" fill="#34d399" opacity="0.8"/>
  <text x="632" y="374" fill="#a7f3d0" opacity="0.6" font-family="monospace" font-size="10">PIPELINE PASSED</text>
</svg>
