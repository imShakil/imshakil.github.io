<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a07"/>
      <stop offset="50%" stop-color="#07140e"/>
      <stop offset="100%" stop-color="#030805"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background with Grid -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial Glow Behind Center -->
  <circle cx="400" cy="225" r="180" fill="#10b981" opacity="0.08" filter="blur(60px)"/>

  <!-- Terminal Window Frame -->
  <rect x="40" y="30" width="720" height="390" rx="10" fill="#040906" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3"/>
  <path d="M 40 68 L 760 68" stroke="#10b981" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Terminal Dots -->
  <circle cx="64" cy="49" r="5" fill="#f87171" opacity="0.8"/>
  <circle cx="82" cy="49" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="100" cy="49" r="5" fill="#34d399" opacity="0.8"/>
  <text x="125" y="53" fill="#6ee7b7" opacity="0.6" font-family="monospace" font-size="12" letter-spacing="1">pacli-cli ~ local-first-vault</text>

  <!-- Left: Terminal CLI Simulation -->
  <rect x="70" y="90" width="370" height="300" rx="8" fill="#020503" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.25"/>
  <text x="90" y="125" fill="#34d399" font-family="monospace" font-size="12">$ pacli init --cipher aes-256-gcm</text>
  <text x="90" y="150" fill="#6ee7b7" opacity="0.75" font-family="monospace" font-size="11">✓ Master vault initialized (PBKDF2)</text>
  <text x="90" y="180" fill="#34d399" font-family="monospace" font-size="12">$ pacli add --label aws-prod --type token</text>
  <text x="90" y="205" fill="#6ee7b7" opacity="0.75" font-family="monospace" font-size="11">✓ Encrypted locally [Zero cloud leak]</text>
  <text x="90" y="235" fill="#34d399" font-family="monospace" font-size="12">$ pacli get --id 04 --clipboard</text>
  <text x="90" y="260" fill="#38bdf8" font-family="monospace" font-size="11">✓ Secret copied to clipboard (TTL: 30s)</text>
  <text x="90" y="295" fill="#34d399" font-family="monospace" font-size="12">$ pacli ssh --server prod-cluster</text>
  <text x="90" y="320" fill="#a7f3d0" font-family="monospace" font-size="11">✓ Connected via encrypted keyfile</text>

  <rect x="90" y="345" width="130" height="24" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="98" y="361" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">pip install pacli-tool</text>

  <!-- Right: Mini Dark Vault UI Cards -->
  <g transform="translate(460, 90)">
    <!-- Vault Card 1 -->
    <rect x="0" y="0" width="270" height="90" rx="8" fill="#091811" stroke="#10b981" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="15" y="15" width="45" height="18" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="23" y="28" fill="#60a5fa" font-family="monospace" font-size="9" font-weight="bold">TOKEN</text>
    <text x="70" y="28" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold">github-pat</text>
    <text x="15" y="55" fill="#6ee7b7" opacity="0.6" font-family="monospace" font-size="10">Encrypted AES-256 GCM</text>
    <text x="15" y="72" fill="#34d399" font-family="monospace" font-size="10">Created: 2025 • Active</text>

    <!-- Vault Card 2 -->
    <rect x="0" y="105" width="270" height="90" rx="8" fill="#091811" stroke="#10b981" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="15" y="120" width="36" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="23" y="133" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">SSH</text>
    <text x="60" y="133" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold">hsm-server</text>
    <text x="15" y="160" fill="#6ee7b7" opacity="0.6" font-family="monospace" font-size="10">Encrypted Keyfile Auth</text>
    <text x="15" y="177" fill="#34d399" font-family="monospace" font-size="10">Port 2222 • Managed</text>

    <!-- Vault Card 3 -->
    <rect x="0" y="210" width="270" height="90" rx="8" fill="#091811" stroke="#10b981" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="15" y="225" width="60" height="18" rx="4" fill="#a855f7" opacity="0.2"/>
    <text x="22" y="238" fill="#c084fc" font-family="monospace" font-size="9" font-weight="bold">PASSWORD</text>
    <text x="85" y="238" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold">aws-cli</text>
    <text x="15" y="265" fill="#6ee7b7" opacity="0.6" font-family="monospace" font-size="10">Zero Cloud Dependencies</text>
    <text x="15" y="282" fill="#38bdf8" font-family="monospace" font-size="10">Auto-Clipboard Copy</text>
  </g>
</svg>
